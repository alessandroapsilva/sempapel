name: Restaura edita PBdoc

on:
  push:
    branches:
      - release/11.5
    paths:
      - .github/workflows/restaura-edita-pbdoc-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 .github/scripts/restaura_edita_pbdoc.py
      - name: Commitar correção
        run: |
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          git rm .github/workflows/restaura-edita-pbdoc-once.yml
          git rm .github/scripts/restaura_edita_pbdoc.py
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/edita.jsp
          git add sigaex/src/main/webapp/javascript/documento.validacao.js
          git commit -m "Restaura botões e modal nativos no padrão PBdoc"
          git push origin HEAD:release/11.5
