name: Corrige modal nomes reais

on:
  push:
    branches:
      - release/11.5
    paths:
      - .github/workflows/corrige-modal-nomes-campos-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0
      - name: Aplicar
        run: python3 .github/scripts/fix-modal-labels.py
      - name: Commitar
        run: |
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          rm -f .github/workflows/corrige-modal-nomes-campos-once.yml
          rm -f .github/scripts/fix-modal-labels.py
          git add sigaex/src/main/webapp/javascript/documento.validacao.js .github/workflows/corrige-modal-nomes-campos-once.yml .github/scripts/fix-modal-labels.py
          git commit -m "Usa nomes reais dos campos no modal e prioriza Assunto"
          git push origin HEAD:release/11.5
# execucao 2
