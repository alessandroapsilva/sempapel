name: Remove estampa visual de assinatura one-shot
on:
  push:
    branches: [ "release/11.5" ]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 1
      - name: Remover somente a estampa visual do PDF
        shell: bash
        run: |
          set -euo pipefail
          FILE='siga-ex/src/main/java/br/gov/jfrj/itextpdf/Stamp.java'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('siga-ex/src/main/java/br/gov/jfrj/itextpdf/Stamp.java')
          s = p.read_text()
          old = '''\t\tif (idsAssinantes != null && idsAssinantes.size() > 0 && Prop.getBool("assinatura.estampar"))\n\t\t\tabPdf = estamparAssinaturas(abPdf, idsAssinantes);'''
          new = '''\t\t// ENFAS: não inserir a imagem/texto visual "assinado eletronicamente" no corpo do PDF.\n\t\t// A assinatura e seus metadados continuam preservados normalmente.\n\t\t// A estampa antiga era aplicada aqui por estamparAssinaturas(...).'''
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado em Stamp.java')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A5 -B2 'ENFAS: não inserir' "$FILE"
          git diff --check
      - name: Commitar correção e remover workflows temporários
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-estampa-assinado-eletronicamente-once.yml
          rm -f .github/workflows/localiza-assinado-eletronicamente-once.yml
          git add siga-ex/src/main/java/br/gov/jfrj/itextpdf/Stamp.java .github/workflows || true
          git commit -m 'Remove estampa assinado eletronicamente dos PDFs'
          git push origin HEAD:release/11.5
