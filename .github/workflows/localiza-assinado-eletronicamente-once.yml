name: Localiza texto assinatura one-shot
on:
  push:
    branches: [ "release/11.5" ]
jobs:
  localizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Procurar texto e trechos relacionados
        shell: bash
        run: |
          set +e
          echo '=== FRASE EXATA ==='
          grep -Rni --exclude-dir=.git -E 'assinado[[:space:]]+eletronicamente' . || true
          echo '=== ASSINADO + ELETRON ==='
          grep -Rni --exclude-dir=.git -E 'assinado.*eletron|eletron.*assinado' siga-ex sigaex 2>/dev/null || true
          echo '=== BLOCOS SUBSCRITOR / ASSINATURA EM EXDOCUMENTO ==='
          grep -n -A40 -B20 -E 'comentarioInicio|blocoSubscritor|INICIO SUBSCRITOR|getConteudoHTML|ASSINATURA' siga-ex/src/main/java/br/gov/jfrj/siga/ex/ExDocumento.java | head -500 || true
