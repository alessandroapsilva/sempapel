name: Remove Anexar exibe definitivo one-shot

on:
  push:
    branches: [ release/11.5 ]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remover injecao do botao Anexar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sigaex/src/main/webapp/javascript/enfas-documento-fix.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('    function installExibeActions() {')
          end = s.find('    function install() {', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
          s = s.replace('        installExibeActions();\n', '')
          s = s.replace('        installExibeActions();\r\n', '')
          p.write_text(s, encoding='utf-8')
          PY

          if grep -nE 'enfas-btn-anexar|installExibeActions' sigaex/src/main/webapp/javascript/enfas-documento-fix.js; then
            echo 'ERRO: ainda existe injecao Anexar'
            exit 1
          fi

      - name: Commitar e limpar workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-anexar-exibe-definitivo-once.yml
          rm -f .github/workflows/remove-anexar-exibe-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sigaex/src/main/webapp/javascript/enfas-documento-fix.js .github/workflows || true
          git commit -m 'Remove definitivamente Anexar injetado no exibe.jsp'
          git push origin HEAD:release/11.5