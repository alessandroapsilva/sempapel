name: Corrige dois pontos da Data no exibe

on:
  push:
    branches: [ "release/11.5" ]
    paths:
      - ".github/workflows/fix-data-colon-once.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0

      - name: Corrigir rotulo Data no exibe.jsp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp')
          s = p.read_text(encoding='utf-8')
          antigo = '<b><fmt:message key="documento.data.assinatura"/>:</b>'
          novo = '<b><fmt:message key="documento.data.assinatura"/></b>'
          if antigo not in s:
              raise SystemExit('Trecho da Data nao encontrado; nenhuma alteracao feita')
          s = s.replace(antigo, novo, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar correcao e remover workflow temporario
        shell: bash
        run: |
          rm -f .github/workflows/fix-data-colon-once.yml
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp .github/workflows/fix-data-colon-once.yml
          git commit -m "Corrige dois pontos duplicado na Data do exibe.jsp"
          git push origin HEAD:release/11.5
