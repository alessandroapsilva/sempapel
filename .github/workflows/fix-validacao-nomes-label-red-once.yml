name: Ajusta validação nomes reais PBdoc

on:
  push:
    branches:
      - release/11.5
    paths:
      - .github/workflows/fix-validacao-nomes-label-red-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 .github/scripts/fix-validacao-nomes-label-red.py
      - name: Commitar
        run: |
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          rm -f .github/workflows/fix-validacao-nomes-label-red-once.yml .github/scripts/fix-validacao-nomes-label-red.py
          git add -A
          git commit -m "Mostra nome real do obrigatório e deixa só label vermelho"
          git push origin HEAD:release/11.5
