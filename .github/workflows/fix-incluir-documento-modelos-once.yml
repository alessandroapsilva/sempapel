name: Corrige carregamento de modelos ao incluir documento

on:
  push:
    branches: [ "release/11.5" ]
    paths:
      - ".github/workflows/fix-incluir-documento-modelos-once.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0

      - name: Corrigir edita.jsp
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          git pull --ff-only origin release/11.5

          python3 - <<'PY'
          from pathlib import Path

          p = Path('sigaex/src/main/webapp/WEB-INF/page/exDocumento/edita.jsp')
          s = p.read_text(encoding='utf-8')

          marcador = '''\t\t\t\t\t<input type="hidden" name="exDocumentoDTO.criandoSubprocesso" value="${exDocumentoDTO.criandoSubprocesso}" />'''
          hidden = marcador + '''\n\t\t\t\t\t<input type="hidden" name="exDocumentoDTO.mobilPaiSel.sigla" value="${exDocumentoDTO.mobilPaiSel.sigla}" />'''
          if 'name="exDocumentoDTO.mobilPaiSel.sigla"' not in s:
              if marcador not in s:
                  raise SystemExit('Ponto para mobilPaiSel.sigla não encontrado')
              s = s.replace(marcador, hidden, 1)

          antigo = '''\t\t\tsuccess : function(result) {\n\t\t\t\tif (result && result.list && result.list.length > 0) {\n\t\t\t\t\tsetUserSessionStorage('lastQry', qry);\n\t\t\t\t\tsetUserSessionStorage('modelos', JSON.stringify(result.list));\n\t\t\t\t\tcarregaModelos(ulMod, result.list);\n\t\t\t\t}\n\t\t\t},'''
          novo = '''\t\t\tsuccess : function(result) {\n\t\t\t\tif (result && result.list && result.list.length > 0) {\n\t\t\t\t\tsetUserSessionStorage('lastQry', qry);\n\t\t\t\t\tsetUserSessionStorage('modelos', JSON.stringify(result.list));\n\t\t\t\t\tcarregaModelos(ulMod, result.list);\n\t\t\t\t} else {\n\t\t\t\t\tif (typeof sigaSpinner !== 'undefined' && sigaSpinner.ocultar) sigaSpinner.ocultar();\n\t\t\t\t\t$('#select-spinner').remove();\n\t\t\t\t\t$('.selected-label .disabled').remove();\n\t\t\t\t\t$('.selected-label').text('Nenhum modelo disponível');\n\t\t\t\t}\n\t\t\t},'''
          if antigo in s:
              s = s.replace(antigo, novo, 1)

          # Também limpa o texto "Carregando..." quando os modelos chegam normalmente.
          alvo = '''\tfunction carregaModelos(ulMod, listMod) {\n\t\tfor (var i = 0; i < listMod.length; i++) {'''
          repl = '''\tfunction carregaModelos(ulMod, listMod) {\n\t\t$('#select-spinner').remove();\n\t\t$('.selected-label .disabled').remove();\n\t\tfor (var i = 0; i < listMod.length; i++) {'''
          if alvo in s:
              s = s.replace(alvo, repl, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-incluir-documento-modelos-once.yml
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/edita.jsp .github/workflows/fix-incluir-documento-modelos-once.yml
          git commit -m "Corrige carregamento de modelos ao incluir documento"
          git push origin HEAD:release/11.5
