name: ENFAS PBdoc merge one-shot

on:
  push:
    branches: [ "release/11.5" ]
    paths:
      - ".github/workflows/enfas-pbdoc-once.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0

      - name: Aplicar ajustes PBdoc/ENFAS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          exibe = Path('sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp')
          s = exibe.read_text(encoding='utf-8')

          # 1) Remove o botão flutuante de assinatura usado apenas como fallback.
          s = re.sub(r'\n\s*\.btn-assinar-fallback\s*\{.*?\.btn-assinar-fallback\s+i\s*\{.*?\}\s*', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*<button id="btn-assinar-fallback".*?</button>\s*', '\n', s, flags=re.S)

          # 2) Remove o supressor global de erro AJAX que não existe no PBdoc.
          s = re.sub(r'\n\s*<script type="text/javascript">\s*\$\(document\)\.ajaxError\(function\(event, jqXHR, settings, error\).*?</script>\s*', '\n', s, flags=re.S)

          # 3) Cabeçalho do PBdoc: sigla + identificador permanente. Mantém sem botão Voltar.
          cabecalho = '''\t\t\t<h2 class="sigla-documento">\n\t\t\t\t<c:if test="${empty ocultarCodigo}">\n\t\t\t\t\t${docVO.sigla}\n\t\t\t\t\t<c:if test="${docVO.doc ne null}">\n\t\t\t\t\t\t<small class="iiiu text-muted" title="Link Permanente: Identificador Incremental Interno Único (ID)">\n\t\t\t\t\t\t\t<a href="${pageContext.request.contextPath}/app/documento/${docVO.doc.id}">#${docVO.doc.id}</a>\n\t\t\t\t\t\t\t<c:if test="${(f:resource('/siga.ambiente') eq 'desenv') or (cadastrante.sesbPessoa eq 'ZZZ')}">\n\t\t\t\t\t\t\t\t<script>\n\t\t\t\t\t\t\t\t\tfunction copiar(targetComponentName) {\n\t\t\t\t\t\t\t\t\t\tconst component = document.getElementById(targetComponentName);\n\t\t\t\t\t\t\t\t\t\tcomponent.select();\n\t\t\t\t\t\t\t\t\t\tnavigator.clipboard.writeText(component.value);\n\t\t\t\t\t\t\t\t\t\talert('Localização do arquivo copiada para a área de transferência.');\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t</script>\n\t\t\t\t\t\t\t\t<input type="hidden" id="docPathInput" name="doc-path-input" value="${f:referenciaArquivo(docVO.doc).getAbsolutePath()}" />\n\t\t\t\t\t\t\t\t<button type="button" class="btn btn-sm btn-link" title="Localização do documento: ${f:referenciaArquivo(docVO.doc).getAbsolutePath()} (clique para copiar)" onclick="copiar('docPathInput')">\n\t\t\t\t\t\t\t\t\t<i class="fa fa-folder"></i>\n\t\t\t\t\t\t\t\t</button>\n\t\t\t\t\t\t\t</c:if>\n\t\t\t\t\t\t</small>\n\t\t\t\t\t</c:if>\n\t\t\t\t</c:if>\n\t\t\t</h2>'''
          s = re.sub(r'\t\t\t<h2(?:\s+class="[^"]*")?>.*?</h2>', cabecalho, s, count=1, flags=re.S)

          # 4) Recupera a seção "Próximo Documento" do PBdoc dentro de Pendências.
          if 'm.pendenciaProximoModelo' not in s:
              marcador = '<tags:collapse title="Pendências" id="Pendencias" collapseMode="${collapse_Expanded}">'
              bloco = '''\n\t\t\t\t\t\t\t\t<c:if test="${not empty m.pendenciaProximoModelo}">\n\t\t\t\t\t\t\t\t\t<p style="margin-bottom: 3px;"><b style="color: rgb(195, 0, 0)">Próximo Documento:</b></p>\n\t\t\t\t\t\t\t\t\t<ul>\n\t\t\t\t\t\t\t\t\t\t<c:if test="${m.pendenciaProximoModelo == 110}"><li><a href="${pageContext.request.contextPath}/app/expediente/doc/editar?mobilPaiSel.sigla=${m.sigla}&criandoAnexo=true" title="Despacho de Concessão de Diárias" style="text-decoration: none">Despacho de Concessão de Diárias</a></li></c:if>\n\t\t\t\t\t\t\t\t\t\t<c:if test="${m.pendenciaProximoModelo == 111}"><li><a href="${pageContext.request.contextPath}/app/expediente/doc/editar?mobilPaiSel.sigla=${m.sigla}&criandoAnexo=true" title="Registro de Pagamento de Diárias" style="text-decoration: none">Registro de Pagamento de Diárias</a></li></c:if>\n\t\t\t\t\t\t\t\t\t\t<c:if test="${m.pendenciaProximoModelo == 112}"><li><a href="${pageContext.request.contextPath}/app/expediente/doc/editar?mobilPaiSel.sigla=${m.sigla}&criandoAnexo=true" title="Certidão de Publicação de Diárias" style="text-decoration: none">Certidão de Publicação de Diárias</a></li></c:if>\n\t\t\t\t\t\t\t\t\t</ul>\n\t\t\t\t\t\t\t\t</c:if>'''
              if marcador in s:
                  s = s.replace(marcador, marcador + bloco, 1)

          # 5) Evita incluir duas vezes o JS de filtro do histórico.
          s = re.sub(r'(<script src="/sigaex/javascript/filtroHistoricoDeMovimentacoes\.js"></script>)\s*\1', r'\1', s)

          exibe.write_text(s, encoding='utf-8')

          # 6) Remove somente a linha visual "assinado eletronicamente" do documento.
          #    Mantém nome/cargo/lotação e a assinatura eletrônica em si.
          exdoc = Path('siga-ex/src/main/java/br/gov/jfrj/siga/ex/ExDocumento.java')
          j = exdoc.read_text(encoding='utf-8')
          antigo = '''\t\t\t\t\t\t\tif (Prop.getBool("assinatura.estampar")) {\n\t\t\t\t\t\t\t\tsb.append("<span>- assinado eletronicamente");\n\t\t\t\t\t\t\t\tString dataHoraAssinatura = getDataHoraAssinaturaPessoaComTokenOuSenha(subscritor);\n\t\t\t\t\t\t\t\tif (dataHoraAssinatura != null)\n\t\t\t\t\t\t\t\t\tsb.append(" em ").append(dataHoraAssinatura);\n\t\t\t\t\t\t\t\tsb.append(" -<br/>");\n\t\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\t\tsb.append("<span>");\n\t\t\t\t\t\t\t}'''
          novo = '''\t\t\t\t\t\t\tsb.append("<span>");'''
          if antigo not in j:
              raise SystemExit('Bloco assinatura.estampar não encontrado em ExDocumento.java')
          j = j.replace(antigo, novo, 1)
          exdoc.write_text(j, encoding='utf-8')

          # Verificações simples antes do commit.
          assert 'btn-assinar-fallback' not in s
          assert 'Link Permanente: Identificador Incremental Interno Único' in s
          assert '- assinado eletronicamente' not in j
          PY

      - name: Commitar resultado e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/enfas-pbdoc-once.yml
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp \
                  siga-ex/src/main/java/br/gov/jfrj/siga/ex/ExDocumento.java \
                  .github/workflows/enfas-pbdoc-once.yml
          git commit -m "Funde exibe com PBdoc e limpa texto da assinatura"
          git push origin HEAD:release/11.5
