name: Remover botoes extras do exibe

on:
  push:
    branches: [ "release/11.5" ]
    paths:
      - ".github/workflows/remove-exibe-buttons-once.yml"

permissions:
  contents: write

jobs:
  remover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0

      - name: Remover Anexar e Voltar extras do exibe.jsp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp')
          s = p.read_text(encoding='utf-8')

          # Remove o botão Voltar do cabeçalho do exibe.jsp.
          s, n_voltar = re.subn(
              r'\n?\s*<button\s+type="button"\s+name="voltar".*?</button>\s*',
              '\n', s, count=1, flags=re.S
          )

          # Remove somente o botão Anexar inserido manualmente antes do loop de ações.
          s, n_anexar = re.subn(
              r'\n?\s*<a\s+class="btn btn-info"\s+href="\$\{pageContext\.request\.contextPath\}/app/expediente/mov/anexar\?sigla=\$\{m\.sigla\}"\s+title="Anexar documento">\s*<i\s+class="fas fa-paperclip"></i>\s*Anexar\s*</a>\s*',
              '\n', s, count=1, flags=re.S
          )

          if n_voltar != 1:
              raise SystemExit(f'Botão Voltar esperado não encontrado: {n_voltar}')
          if n_anexar != 1:
              raise SystemExit(f'Botão Anexar manual esperado não encontrado: {n_anexar}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar limpeza e remover workflow temporario
        shell: bash
        run: |
          rm -f .github/workflows/remove-exibe-buttons-once.yml
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp .github/workflows/remove-exibe-buttons-once.yml
          git commit -m "Remove Anexar e Voltar extras do exibe.jsp"
          git push origin HEAD:release/11.5
