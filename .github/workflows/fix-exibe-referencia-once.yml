name: Fix exibe referencia one-shot
on:
  push:
    branches: [release/11.5]
jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0
      - name: Remover recurso incompatível do PBdoc
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\t\t\t\t\t<c:if test="${(f:resource('/siga.ambiente') eq 'desenv') or (cadastrante.sesbPessoa eq 'ZZZ')}">\n\t\t\t\t\t\t\t\t<script>\n\t\t\t\t\t\t\t\t\tfunction copiar(targetComponentName) {\n\t\t\t\t\t\t\t\t\t\tconst component = document.getElementById(targetComponentName);\n\t\t\t\t\t\t\t\t\t\tcomponent.select();\n\t\t\t\t\t\t\t\t\t\tnavigator.clipboard.writeText(component.value);\n\t\t\t\t\t\t\t\t\t\talert('Localização do arquivo copiada para a área de transferência.');\n\t\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t\t</script>\n\t\t\t\t\t\t\t\t<input type="hidden" id="docPathInput" name="doc-path-input" value="${f:referenciaArquivo(docVO.doc).getAbsolutePath()}" />\n\t\t\t\t\t\t\t\t<button type="button" class="btn btn-sm btn-link" title="Localização do documento: ${f:referenciaArquivo(docVO.doc).getAbsolutePath()} (clique para copiar)" onclick="copiar('docPathInput')">\n\t\t\t\t\t\t\t\t\t<i class="fa fa-folder"></i>\n\t\t\t\t\t\t\t\t</button>\n\t\t\t\t\t\t\t</c:if>\n'''
          if old not in s:
              raise SystemExit('Bloco referenciaArquivo não encontrado; abortando para não alterar coisa errada.')
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          ! grep -q 'referenciaArquivo' sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp
          grep -n 'sigla-documento' sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp | head
      - name: Commitar e remover workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-exibe-referencia-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sigaex/src/main/webapp/WEB-INF/page/exDocumento/exibe.jsp .github/workflows/fix-exibe-referencia-once.yml
          git commit -m "Corrige exibe.jsp para release 11.5 sem referenciaArquivo"
          git push origin HEAD:release/11.5
