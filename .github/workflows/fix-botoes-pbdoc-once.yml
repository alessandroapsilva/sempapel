name: Ajusta botoes PBdoc

on:
  push:
    branches:
      - release/11.5
    paths:
      - .github/workflows/fix-botoes-pbdoc-once.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/11.5
          fetch-depth: 0
      - name: Aplicar
        run: python3 .github/scripts/fix-botoes-pbdoc.py
      - name: Commitar
        run: |
          git config user.name "ENFAS Bot"
          git config user.email "enfas@users.noreply.github.com"
          rm -f .github/workflows/fix-botoes-pbdoc-once.yml .github/scripts/fix-botoes-pbdoc.py
          git add -A
          git commit -m "Deixa botoes do edita no padrão PBdoc"
          git push origin HEAD:release/11.5
